syntax = "proto3";

package applicant.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "k12_backend/api/applicant/v1";

// ApplicantService 申请人服务
service ApplicantService {
  // CreateApplicant 创建申请人信息
  rpc CreateApplicant(CreateApplicantRequest) returns (Applicant) {
    option (google.api.http) = {
      post: "/api/v1/applicant"
      body: "*"
    };
  }
  
  // GetApplicant 获取申请人信息
  rpc GetApplicant(GetApplicantRequest) returns (Applicant) {
    option (google.api.http) = {
      get: "/api/v1/applicant/{id}"
    };
  }
  
  // UpdateApplicant 更新申请人信息
  rpc UpdateApplicant(UpdateApplicantRequest) returns (Applicant) {
    option (google.api.http) = {
      put: "/api/v1/applicant/{id}"
      body: "*"
    };
  }
  
  // ListApplicants 列出申请人列表
  rpc ListApplicants(ListApplicantsRequest) returns (ListApplicantsResponse) {
    option (google.api.http) = {
      get: "/api/v1/applicants"
    };
  }
  
  // DeleteApplicant 删除申请人信息
  rpc DeleteApplicant(DeleteApplicantRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/api/v1/applicant/{id}"
    };
  }
  
  // GetApplicantByUserID 根据用户ID获取申请人信息
  rpc GetApplicantByUserID(GetApplicantByUserIDRequest) returns (Applicant) {
    option (google.api.http) = {
      get: "/api/v1/applicant/user/{user_id}"
    };
  }
}

// Applicant 申请人信息
message Applicant {
  string id = 1;
  string user_id = 2;
  string passport_name = 3;
  string family_name = 4;
  string middle_name = 5;
  string given_name = 6;
  string chinese_name = 7;
  google.protobuf.Timestamp birth_date = 8;
  string nationality = 9;
  string birth_country = 10;
  string birth_city = 11;
  string gender = 12;
  string marital_status = 13;
  string religion = 14;
  string passport_number = 15;
  google.protobuf.Timestamp passport_expiry = 16;
  string home_phone = 17;
  string email = 18;
  string wechat = 19;
  string qq = 20;
  string home_address = 21;
  bool has_contact = 22;
  string contact_name = 23;
  string contact_relationship = 24;
  string contact_phone = 25;
  string contact_email = 26;
  string contact_type = 27;
  bool is_chinese_heritage = 28;
  string chinese_heritage_details = 29;
  string mailing_address = 30;
  string mailing_zip = 31;
  string mailing_country = 32;
  string clothing_size = 33;
  string family_members = 34;
  string education_id = 35;
  google.protobuf.Timestamp created_at = 36;
  google.protobuf.Timestamp updated_at = 37;
}

// CreateApplicantRequest 创建申请人请求
message CreateApplicantRequest {
  string user_id = 1;
  string passport_name = 2;
  string family_name = 3;
  string middle_name = 4;
  string given_name = 5;
  string chinese_name = 6;
  google.protobuf.Timestamp birth_date = 7;
  string nationality = 8;
  string birth_country = 9;
  string birth_city = 10;
  string gender = 11;
  string marital_status = 12;
  string religion = 13;
  string passport_number = 14;
  google.protobuf.Timestamp passport_expiry = 15;
  string home_phone = 16;
  string email = 17;
  string wechat = 18;
  string qq = 19;
  string home_address = 20;
  bool has_contact = 21;
  string contact_name = 22;
  string contact_relationship = 23;
  string contact_phone = 24;
  string contact_email = 25;
  string contact_type = 26;
  bool is_chinese_heritage = 27;
  string chinese_heritage_details = 28;
  string mailing_address = 29;
  string mailing_zip = 30;
  string mailing_country = 31;
  string clothing_size = 32;
  string family_members = 33;
  string education_id = 34;
}

// GetApplicantRequest 获取申请人请求
message GetApplicantRequest {
  string id = 1;
}

// UpdateApplicantRequest 更新申请人请求
message UpdateApplicantRequest {
  string id = 1;
  string user_id = 2;
  string passport_name = 3;
  string family_name = 4;
  string middle_name = 5;
  string given_name = 6;
  string chinese_name = 7;
  google.protobuf.Timestamp birth_date = 8;
  string nationality = 9;
  string birth_country = 10;
  string birth_city = 11;
  string gender = 12;
  string marital_status = 13;
  string religion = 14;
  string passport_number = 15;
  google.protobuf.Timestamp passport_expiry = 16;
  string home_phone = 17;
  string email = 18;
  string wechat = 19;
  string qq = 20;
  string home_address = 21;
  bool has_contact = 22;
  string contact_name = 23;
  string contact_relationship = 24;
  string contact_phone = 25;
  string contact_email = 26;
  string contact_type = 27;
  bool is_chinese_heritage = 28;
  string chinese_heritage_details = 29;
  string mailing_address = 30;
  string mailing_zip = 31;
  string mailing_country = 32;
  string clothing_size = 33;
  string family_members = 34;
  string education_id = 35;
}

// ListApplicantsRequest 列出申请人请求
message ListApplicantsRequest {
  int32 page = 1;
  int32 page_size = 2;
  string keyword = 3;
}

// ListApplicantsResponse 列出申请人响应
message ListApplicantsResponse {
  repeated Applicant applicants = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// DeleteApplicantRequest 删除申请人请求
message DeleteApplicantRequest {
  string id = 1;
}

// GetApplicantByUserIDRequest 根据用户ID获取申请人请求
message GetApplicantByUserIDRequest {
  string user_id = 1;
}
