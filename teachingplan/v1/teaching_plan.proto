syntax = "proto3";

package teachingplan.v1;

option go_package = "k12_backend/api/teachingplan/v1;v1";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service TeachingPlanService {
  rpc GetTeachingPlanRetentionPreview(GetRetentionPreviewRequest) returns (RetentionPreview) { option (google.api.http) = {get: "/v1/admin/teaching-plan-templates/{id}/retention"}; }
  rpc ArchiveTeachingPlanTemplate(RetentionMutationRequest) returns (TeachingPlanTemplate) { option (google.api.http) = {post: "/v1/admin/teaching-plan-templates/{id}:archive" body: "*"}; }
  rpc RestoreTeachingPlanTemplate(RetentionMutationRequest) returns (TeachingPlanTemplate) { option (google.api.http) = {post: "/v1/admin/teaching-plan-templates/{id}:restore" body: "*"}; }
  rpc DeleteTeachingPlanTemplate(DeleteRetentionResourceRequest) returns (google.protobuf.Empty) { option (google.api.http) = {delete: "/v1/admin/teaching-plan-templates/{id}"}; }
  rpc GetClassOfferingRetentionPreview(GetRetentionPreviewRequest) returns (RetentionPreview) { option (google.api.http) = {get: "/v1/admin/class-offerings/{id}/retention"}; }
  rpc ArchiveClassOffering(RetentionMutationRequest) returns (ClassOffering) { option (google.api.http) = {post: "/v1/admin/class-offerings/{id}:archive" body: "*"}; }
  rpc RestoreClassOffering(RetentionMutationRequest) returns (ClassOffering) { option (google.api.http) = {post: "/v1/admin/class-offerings/{id}:restore" body: "*"}; }
  rpc DeleteClassOffering(DeleteRetentionResourceRequest) returns (google.protobuf.Empty) { option (google.api.http) = {delete: "/v1/admin/class-offerings/{id}"}; }
  rpc ListClassOfferings(ListClassOfferingsRequest) returns (ListClassOfferingsResponse) { option (google.api.http) = {get: "/v1/admin/class-offerings"}; }
  rpc CreateClassOffering(CreateClassOfferingRequest) returns (CreateClassOfferingResult) { option (google.api.http) = {post: "/v1/admin/class-offerings" body: "*"}; }
  rpc UpdateClassOffering(UpdateClassOfferingRequest) returns (ClassOffering) { option (google.api.http) = {patch: "/v1/admin/class-offerings/{id}" body: "*"}; }
  rpc PublishClassOffering(PublishClassOfferingRequest) returns (ClassOffering) { option (google.api.http) = {post: "/v1/admin/class-offerings/{id}/publish" body: "*"}; }
  rpc ListClassOfferingMembers(ListClassOfferingMembersRequest) returns (ListClassOfferingMembersResponse) { option (google.api.http) = {get: "/v1/admin/class-offerings/{class_offering_id}/members"}; }
  rpc AddClassOfferingMember(AddClassOfferingMemberRequest) returns (ClassOfferingMember) { option (google.api.http) = {post: "/v1/admin/class-offerings/{class_offering_id}/members" body: "*"}; }
  rpc RemoveClassOfferingMember(RemoveClassOfferingMemberRequest) returns (google.protobuf.Empty) { option (google.api.http) = {delete: "/v1/admin/class-offerings/{class_offering_id}/members/{member_id}"}; }
  rpc ListAvailableClassOfferings(ListAvailableClassOfferingsRequest) returns (ListClassOfferingsResponse) { option (google.api.http) = {get: "/v1/class-offerings"}; }
  rpc EnrollClassOffering(EnrollClassOfferingRequest) returns (EnrollClassOfferingResponse) { option (google.api.http) = {post: "/v1/class-offerings/{offering_id}/enroll" body: "*"}; }
  rpc ListMyClassOfferings(ListMyClassOfferingsRequest) returns (ListMyClassOfferingsResponse) { option (google.api.http) = {get: "/v1/user/class-offerings"}; }
  rpc ListPrograms(ListProgramsRequest) returns (ListProgramsResponse) { option (google.api.http) = {get: "/v1/programs"}; }
  rpc GetProgram(GetProgramRequest) returns (ProgramDetail) { option (google.api.http) = {get: "/v1/programs/{program_id}"}; }
  rpc ListTeachingPlanTemplates(ListTeachingPlanTemplatesRequest) returns (ListTeachingPlanTemplatesResponse) {
    option (google.api.http) = {get: "/v1/admin/teaching-plan-templates"};
  }
  rpc UpdateTeachingPlanPublicProfile(UpdateTeachingPlanPublicProfileRequest) returns (TeachingPlanTemplate) {
    option (google.api.http) = {patch: "/v1/admin/teaching-plan-templates/{id}/public-profile" body: "*"};
  }
  rpc SetTeachingPlanPublicationStatus(SetTeachingPlanPublicationStatusRequest) returns (TeachingPlanTemplate) {
    option (google.api.http) = {post: "/v1/admin/teaching-plan-templates/{id}:set-publication-status" body: "*"};
  }
  rpc CreateTeachingPlanTemplate(CreateTeachingPlanTemplateRequest) returns (TeachingPlanTemplate) {
    option (google.api.http) = {post: "/v1/admin/teaching-plan-templates" body: "*"};
  }
  rpc CreateTeachingPlanSetup(CreateTeachingPlanSetupRequest) returns (TeachingPlanSetupResult) {
    option (google.api.http) = {post: "/v1/admin/teaching-plan-setups" body: "*"};
  }
  rpc CloneTeachingPlanTemplate(CloneTeachingPlanTemplateRequest) returns (TeachingPlanTemplate) { option (google.api.http) = {post: "/v1/admin/teaching-plan-templates/{source_template_id}/clone" body: "*"}; }
  rpc GetTeachingPlanTemplate(GetTeachingPlanTemplateRequest) returns (TeachingPlanTemplateDetail) {
    option (google.api.http) = {get: "/v1/admin/teaching-plan-templates/{id}"};
  }
  rpc CreateTeachingPlanDraft(CreateTeachingPlanDraftRequest) returns (TeachingPlanVersion) {
    option (google.api.http) = {post: "/v1/admin/teaching-plan-templates/{template_id}/drafts" body: "*"};
  }
  rpc SaveTeachingPlanDraft(SaveTeachingPlanDraftRequest) returns (TeachingPlanVersion) {
    option (google.api.http) = {put: "/v1/admin/teaching-plan-template-versions/{version_id}" body: "*"};
  }
  rpc SaveTeachingPlanLesson(SaveTeachingPlanLessonRequest) returns (SaveTeachingPlanLessonResponse) {
    option (google.api.http) = {put: "/v1/admin/teaching-plan-versions/{version_id}/lessons/{lesson_id}" body: "*"};
  }
  rpc PreviewTeachingPlanLessonSync(PreviewTeachingPlanLessonSyncRequest) returns (TeachingPlanLessonSyncPreview) {
    option (google.api.http) = {post: "/v1/admin/teaching-plan-versions/{version_id}/lessons/{lesson_id}:preview-sync" body: "*"};
  }
  rpc ApplyTeachingPlanLessonSync(ApplyTeachingPlanLessonSyncRequest) returns (ApplyTeachingPlanLessonSyncResponse) {
    option (google.api.http) = {post: "/v1/admin/teaching-plan-versions/{version_id}/lessons/{lesson_id}:apply-sync" body: "*"};
  }
  rpc PublishTeachingPlanVersion(PublishTeachingPlanVersionRequest) returns (TeachingPlanVersion) {
    option (google.api.http) = {post: "/v1/admin/teaching-plan-template-versions/{version_id}/publish" body: "*"};
  }
  rpc InitializeTeachingPlanLessons(InitializeTeachingPlanLessonsRequest) returns (TeachingPlanVersion) {
    option (google.api.http) = {post: "/v1/admin/teaching-plan-template-versions/{version_id}/lessons:initialize" body: "*"};
  }
  rpc ListSchedulingResources(ListSchedulingResourcesRequest) returns (ListSchedulingResourcesResponse) {
    option (google.api.http) = {get: "/v1/admin/scheduling-resources"};
  }
  rpc BatchApplyTeachingPlanToOfferings(BatchApplyTeachingPlanToOfferingsRequest) returns (BatchApplyTeachingPlanToOfferingsResponse) {
    option (google.api.http) = {post: "/v1/admin/class-offerings:apply-teaching-plan" body: "*"};
  }
  rpc ListClassPlanAssignments(ListClassPlanAssignmentsRequest) returns (ListClassPlanAssignmentsResponse) {
    option (google.api.http) = {get: "/v1/admin/class-offerings/{class_offering_id}/plan-assignments"};
  }
  rpc GetClassPlanTimeline(GetClassPlanTimelineRequest) returns (ClassPlanTimeline) {
    option (google.api.http) = {get: "/v1/admin/class-plan-assignments/{assignment_id}/timeline"};
  }
  rpc UpdateClassPlanAssignment(UpdateClassPlanAssignmentRequest) returns (ClassPlanAssignment) {
    option (google.api.http) = {patch: "/v1/admin/class-plan-assignments/{id}" body: "*"};
  }
  rpc PutClassPlanItemOverride(PutClassPlanItemOverrideRequest) returns (ClassPlanItemOverride) {
    option (google.api.http) = {put: "/v1/admin/class-plan-assignments/{assignment_id}/overrides/{item_id}" body: "*"};
  }
  rpc DeleteClassPlanItemOverride(DeleteClassPlanItemOverrideRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/admin/class-plan-assignments/{assignment_id}/overrides/{item_id}"};
  }
  rpc PutClassPlanLessonOverride(PutClassPlanLessonOverrideRequest) returns (ClassPlanLessonOverride) {
    option (google.api.http) = {put: "/v1/admin/class-plan-assignments/{assignment_id}/lesson-overrides/{lesson_id}" body: "*"};
  }
  rpc DeleteClassPlanLessonOverride(DeleteClassPlanLessonOverrideRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/admin/class-plan-assignments/{assignment_id}/lesson-overrides/{lesson_id}"};
  }
  rpc PublishClassPlanAssignment(PublishClassPlanAssignmentRequest) returns (ClassPlanAssignment) {
    option (google.api.http) = {post: "/v1/admin/class-plan-assignments/{assignment_id}/publish" body: "*"};
  }
  rpc ListClassPlanLiveInstances(ListClassPlanLiveInstancesRequest) returns (ListClassPlanLiveInstancesResponse) { option (google.api.http) = {get: "/v1/admin/class-plan-assignments/{assignment_id}/live-instances"}; }
  rpc RetryClassPlanLiveInstance(RetryClassPlanLiveInstanceRequest) returns (google.protobuf.Empty) { option (google.api.http) = {post: "/v1/admin/live-instances/{instance_id}:retry" body: "*"}; }
  rpc PreviewOfferingLiveChanges(PreviewOfferingLiveChangesRequest) returns (OfferingLiveChangePreview) { option (google.api.http) = {post: "/v1/admin/class-offerings/{offering_id}/live-changes:preview" body: "*"}; }
  rpc ApplyOfferingLiveChanges(ApplyOfferingLiveChangesRequest) returns (google.protobuf.Empty) { option (google.api.http) = {post: "/v1/admin/class-offerings/{offering_id}/live-changes:apply" body: "*"}; }
  rpc SetLiveInstanceTeacherOverride(SetLiveInstanceTeacherOverrideRequest) returns (google.protobuf.Empty) { option (google.api.http) = {put: "/v1/admin/live-instances/{instance_id}/teacher-override" body: "*"}; }
  rpc ClearLiveInstanceTeacherOverride(ClearLiveInstanceTeacherOverrideRequest) returns (google.protobuf.Empty) { option (google.api.http) = {delete: "/v1/admin/live-instances/{instance_id}/teacher-override"}; }
  rpc PreviewClassPlanSync(PreviewClassPlanSyncRequest) returns (ClassPlanSyncPreview) { option (google.api.http) = {post: "/v1/admin/class-offerings/{offering_id}/plan-sync:preview" body: "*"}; }
  rpc ApplyClassPlanSync(ApplyClassPlanSyncRequest) returns (ClassPlanAssignment) { option (google.api.http) = {post: "/v1/admin/class-offerings/{offering_id}/plan-sync:apply" body: "*"}; }
  rpc GetMyCourseSchedule(GetMyCourseScheduleRequest) returns (GetMyCourseScheduleResponse) {
    option (google.api.http) = {get: "/v1/courses/{course_id}/schedule"};
  }
  rpc GetMyChapterSchedule(GetMyChapterScheduleRequest) returns (GetMyChapterScheduleResponse) {
    option (google.api.http) = {get: "/v1/courses/{course_id}/chapters/{chapter_id}/schedule"};
  }
  rpc GetMyLessonSchedule(GetMyLessonScheduleRequest) returns (GetMyLessonScheduleResponse) {
    option (google.api.http) = {get: "/v1/courses/{course_id}/lessons/{lesson_id}/schedule"};
  }
  rpc OpenLearningTask(OpenLearningTaskRequest) returns (OpenLearningTaskResponse) {
    option (google.api.http) = {
      post: "/v1/courses/{course_id}/lessons/{plan_lesson_id}/tasks/{plan_item_id}:open"
      body: "*"
      additional_bindings: {post: "/v1/courses/{course_id}/chapters/{chapter_id}/tasks/{plan_item_id}:open" body: "*"}
    };
  }
  rpc CompleteExternalLearningTask(CompleteExternalLearningTaskRequest) returns (CompleteExternalLearningTaskResponse) {
    option (google.api.http) = {post: "/v1/learning/tasks/{plan_item_id}:complete-external" body: "*"};
  }
}

message GetRetentionPreviewRequest { int64 id = 1; }
message RetentionMutationRequest { int64 id = 1; }
message DeleteRetentionResourceRequest { int64 id = 1; string confirmation_name = 2; }
message RetentionBlocker { string code = 1; string message = 2; }
message RetentionPreview {
  string current_status = 1;
  bool can_archive = 2;
  bool can_restore = 3;
  bool can_delete = 4;
  repeated RetentionBlocker archive_blockers = 5;
  repeated RetentionBlocker delete_blockers = 6;
  int32 class_offering_count = 7;
  int32 enrollment_count = 8;
  int32 progress_count = 9;
  int32 live_instance_count = 10;
  int32 active_live_instance_count = 11;
  int32 provisioning_job_count = 12;
}

enum PlanResourceType {
  PLAN_RESOURCE_TYPE_UNSPECIFIED = 0;
  PLAN_RESOURCE_TYPE_COURSE = 1;
  PLAN_RESOURCE_TYPE_COURSEWARE = 2;
  PLAN_RESOURCE_TYPE_EXAM = 3;
  PLAN_RESOURCE_TYPE_LIVE = 4;
  PLAN_RESOURCE_TYPE_SECTION = 5;
}

enum TaskProgressStatus {
  TASK_PROGRESS_STATUS_UNSPECIFIED = 0;
  TASK_PROGRESS_STATUS_NOT_STARTED = 1;
  TASK_PROGRESS_STATUS_IN_PROGRESS = 2;
  TASK_PROGRESS_STATUS_COMPLETED = 3;
}

enum TaskPresentationStatus {
  TASK_PRESENTATION_STATUS_UNSPECIFIED = 0;
  TASK_PRESENTATION_STATUS_AVAILABLE = 1;
  TASK_PRESENTATION_STATUS_LOCKED = 2;
  TASK_PRESENTATION_STATUS_PENDING_SYNC = 3;
  TASK_PRESENTATION_STATUS_LIVE_UPCOMING = 4;
  TASK_PRESENTATION_STATUS_LIVE_NOW = 5;
  TASK_PRESENTATION_STATUS_ATTENDANCE_INSUFFICIENT = 6;
  TASK_PRESENTATION_STATUS_MISSED = 7;
  TASK_PRESENTATION_STATUS_RESOURCE_UNAVAILABLE = 8;
}

enum LaunchMode {
  LAUNCH_MODE_UNSPECIFIED = 0;
  LAUNCH_MODE_IFRAME = 1;
  LAUNCH_MODE_NEW_TAB = 2;
}

enum TeachingRole {
  TEACHING_ROLE_UNSPECIFIED = 0;
  TEACHING_ROLE_LESSON = 1;
  TEACHING_ROLE_IN_CLASS_PRACTICE = 2;
  TEACHING_ROLE_HOMEWORK = 3;
  TEACHING_ROLE_ASSESSMENT = 4;
}

enum ScheduleMode {
  SCHEDULE_MODE_UNSPECIFIED = 0;
  SCHEDULE_MODE_RELATIVE = 1;
  SCHEDULE_MODE_ABSOLUTE = 2;
}

enum ResultVisibility {
  RESULT_VISIBILITY_UNSPECIFIED = 0;
  RESULT_VISIBILITY_IMMEDIATE = 1;
  RESULT_VISIBILITY_AFTER_DUE = 2;
  RESULT_VISIBILITY_HIDDEN = 3;
}

enum AnswerVisibility {
  ANSWER_VISIBILITY_UNSPECIFIED = 0;
  ANSWER_VISIBILITY_AFTER_SUBMIT = 1;
  ANSWER_VISIBILITY_AFTER_DUE = 2;
  ANSWER_VISIBILITY_HIDDEN = 3;
}

enum LateSubmissionPolicy {
  LATE_SUBMISSION_POLICY_UNSPECIFIED = 0;
  LATE_SUBMISSION_POLICY_REJECT = 1;
  LATE_SUBMISSION_POLICY_ALLOW = 2;
}

enum LifecycleStatus {
  LIFECYCLE_STATUS_UNSPECIFIED = 0;
  LIFECYCLE_STATUS_DRAFT = 1;
  LIFECYCLE_STATUS_ACTIVE = 2;
  LIFECYCLE_STATUS_ARCHIVED = 3;
  LIFECYCLE_STATUS_PUBLISHED = 4;
  LIFECYCLE_STATUS_SUPERSEDED = 5;
  LIFECYCLE_STATUS_PUBLISHING = 6;
  LIFECYCLE_STATUS_PARTIAL_FAILURE = 7;
}

enum TeachingPlanSetupMode {
  TEACHING_PLAN_SETUP_MODE_UNSPECIFIED = 0;
  TEACHING_PLAN_SETUP_MODE_OUTLINE_STANDARD = 1;
  TEACHING_PLAN_SETUP_MODE_OUTLINE_AI_ONLY = 2;
  TEACHING_PLAN_SETUP_MODE_OUTLINE_CUSTOM = 3;
  TEACHING_PLAN_SETUP_MODE_BLANK = 4;
  TEACHING_PLAN_SETUP_MODE_LIVE_ONLY = 5;
}

enum TeachingPlanAISource {
  TEACHING_PLAN_AI_SOURCE_UNSPECIFIED = 0;
  TEACHING_PLAN_AI_SOURCE_COURSE = 1;
  TEACHING_PLAN_AI_SOURCE_SHARE = 2;
}

enum TeachingPlanPublicationStatus {
  TEACHING_PLAN_PUBLICATION_STATUS_UNSPECIFIED = 0;
  TEACHING_PLAN_PUBLICATION_STATUS_DRAFT = 1;
  TEACHING_PLAN_PUBLICATION_STATUS_PUBLISHED = 2;
  TEACHING_PLAN_PUBLICATION_STATUS_OFFLINE = 3;
}

enum StudentLessonStatus {
  STUDENT_LESSON_STATUS_UNSPECIFIED = 0;
  STUDENT_LESSON_STATUS_LOCKED = 1;
  STUDENT_LESSON_STATUS_NOT_STARTED = 2;
  STUDENT_LESSON_STATUS_IN_PROGRESS = 3;
  STUDENT_LESSON_STATUS_COMPLETED = 4;
}

message PageInfo {
  int32 page = 1;
  int32 page_size = 2;
  int64 total = 3;
}

message ClassOffering {
  int64 id = 1; string code = 2; string name = 3; int64 course_id = 4; int64 template_version_id = 5;
  string teacher_name = 6; string teacher_casdoor_subject = 7; string schedule_text = 8; string timezone = 9;
  google.protobuf.Timestamp enrollment_starts_at = 10; google.protobuf.Timestamp enrollment_ends_at = 11;
  google.protobuf.Timestamp class_starts_at = 12; google.protobuf.Timestamp class_ends_at = 13;
  int32 capacity = 14; int32 enrolled_count = 15; int64 price_cents = 16; string currency = 17; string status = 18;
  google.protobuf.Timestamp created_at = 19; google.protobuf.Timestamp updated_at = 20;
  string external_live_series_id = 21;
  string live_series_status = 22;
  string live_series_last_error_code = 23;
  string live_series_last_error_message = 24;
  google.protobuf.Timestamp live_series_last_synced_at = 25;
}
message ListClassOfferingsRequest {
  int64 course_id = 1;
  string status = 2;
  int32 page = 3;
  int32 page_size = 4;
  string query = 5;
  string teacher_name = 6;
  google.protobuf.Timestamp starts_after = 7;
  google.protobuf.Timestamp starts_before = 8;
}
message ListClassOfferingsResponse { repeated ClassOffering offerings = 1; PageInfo page_info = 2; }
message CreateClassOfferingRequest {
  string name = 1; int64 course_id = 2; int64 template_version_id = 3; string teacher_name = 4;
  string teacher_casdoor_subject = 5; string schedule_text = 6; string timezone = 7; google.protobuf.Timestamp enrollment_starts_at = 8;
  google.protobuf.Timestamp enrollment_ends_at = 9; google.protobuf.Timestamp class_starts_at = 10; google.protobuf.Timestamp class_ends_at = 11;
  int32 capacity = 12; int64 price_cents = 13; string currency = 14; string request_id = 15;
}
message LiveProvisioningSummary { int32 total = 1; int32 pending = 2; int32 ready = 3; int32 failed = 4; }
message CreateClassOfferingResult {
  ClassOffering offering = 1;
  ClassPlanAssignment assignment = 2;
  int32 generated_lesson_count = 3;
  int32 generated_task_count = 4;
  LiveProvisioningSummary provisioning = 5;
}
message UpdateClassOfferingRequest {
  int64 id = 1; string name = 2; string teacher_name = 3; string teacher_casdoor_subject = 4; string schedule_text = 5;
  google.protobuf.Timestamp enrollment_starts_at = 6; google.protobuf.Timestamp enrollment_ends_at = 7;
  google.protobuf.Timestamp class_starts_at = 8; google.protobuf.Timestamp class_ends_at = 9;
  int32 capacity = 10; int64 price_cents = 11; string currency = 12;
}
message PublishClassOfferingRequest { int64 id = 1; }
message ListAvailableClassOfferingsRequest { int64 course_id = 1; int32 page = 2; int32 page_size = 3; }
message EnrollClassOfferingRequest { int64 offering_id = 1; }
message EnrollClassOfferingResponse { ClassOffering offering = 1; bool already_enrolled = 2; }
message ListMyClassOfferingsRequest {}
message MyClassOfferingSummary {
  ClassOffering offering = 1;
  int64 course_id = 2;
  string course_title = 3;
  string course_cover_url = 4;
  int64 assignment_id = 5;
  int32 total_lesson_count = 6;
  int32 completed_lesson_count = 7;
  int64 next_lesson_id = 8;
  int64 next_task_id = 9;
  string next_task_title = 10;
  PlanResourceType next_task_type = 11;
  google.protobuf.Timestamp next_task_unlock_at = 12;
  bool schedule_ready = 13;
  bool completed = 14;
}
message ListMyClassOfferingsResponse { repeated MyClassOfferingSummary classes = 1; }
message ClassOfferingMember {
  int64 id = 1; int64 class_offering_id = 2; int64 user_id = 3; string casdoor_subject = 4;
  string role = 5; string status = 6; google.protobuf.Timestamp joined_at = 7; google.protobuf.Timestamp removed_at = 8;
}
message ListClassOfferingMembersRequest { int64 class_offering_id = 1; }
message ListClassOfferingMembersResponse { repeated ClassOfferingMember members = 1; }
message AddClassOfferingMemberRequest { int64 class_offering_id = 1; int64 user_id = 2; string casdoor_subject = 3; string role = 4; }
message RemoveClassOfferingMemberRequest { int64 class_offering_id = 1; int64 member_id = 2; }

message ListProgramsRequest {
  int32 page = 1;
  int32 page_size = 2;
  string query = 3;
  string subject_code = 4;
  string stage_code = 5;
}
message ProgramSummary {
  int64 program_id = 1;
  string public_title = 2;
  string public_summary = 3;
  string cover_url = 4;
  string subject_code = 5;
  string stage_code = 6;
  int32 lesson_count = 7;
  int32 available_offering_count = 8;
}
message ListProgramsResponse {
  repeated ProgramSummary programs = 1;
  PageInfo page_info = 2;
}
message ProgramTaskTypeSummary {
  PlanResourceType resource_type = 1;
  int32 count = 2;
}
message ProgramLessonSummary {
  int32 lesson_no = 1;
  string title = 2;
  repeated ProgramTaskTypeSummary task_types = 3;
}
message ProgramOfferingSummary {
  int64 offering_id = 1;
  string name = 2;
  string teacher_name = 3;
  google.protobuf.Timestamp first_lesson_at = 4;
  int32 room_type = 5;
  int32 capacity = 6;
  int32 enrolled_count = 7;
  double price = 8;
  string currency = 9;
  string enrollment_status = 10;
}
message GetProgramRequest { int64 program_id = 1; }
message ProgramDetail {
  ProgramSummary program = 1;
  repeated ProgramLessonSummary lessons = 2;
  repeated ProgramOfferingSummary offerings = 3;
}

message TeachingPlanTemplate {
  int64 id = 1;
  string code = 2;
  string name = 3;
  string description = 4;
  LifecycleStatus status = 5;
  int64 current_version_id = 6;
  int32 current_version_no = 7;
  int32 item_count = 8;
  int32 assignment_count = 9;
  string created_by = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  // Student-facing course detail page that displays this schedule.
  int64 entry_course_id = 13;
  string public_title = 14;
  string public_summary = 15;
  string cover_url = 16;
  string subject_code = 17;
  string stage_code = 18;
  TeachingPlanPublicationStatus publication_status = 19;
  google.protobuf.Timestamp published_at = 20;
}

message ListTeachingPlanTemplatesRequest {
  int32 page = 1;
  int32 page_size = 2;
  LifecycleStatus status = 3;
  string query = 4;
  int64 entry_course_id = 5;
  TeachingPlanPublicationStatus publication_status = 6;
  string subject_code = 7;
  string stage_code = 8;
}
message ListTeachingPlanTemplatesResponse { repeated TeachingPlanTemplate templates = 1; PageInfo page_info = 2; }
message UpdateTeachingPlanPublicProfileRequest {
  int64 id = 1;
  string public_title = 2;
  string public_summary = 3;
  string cover_url = 4;
  string subject_code = 5;
  string stage_code = 6;
}
message SetTeachingPlanPublicationStatusRequest {
  int64 id = 1;
  TeachingPlanPublicationStatus publication_status = 2;
}
message CreateTeachingPlanTemplateRequest { string code = 1; string name = 2; string description = 3; int64 entry_course_id = 4; }
// Identifies one node in the canonical course-outline order. A section node
// carries both IDs; a chapter fallback node leaves section_id unset.
message OutlineNodeRef {
  int64 chapter_id = 1;
  int64 section_id = 2;
}
// One contiguous outline group becomes one teaching-plan lesson. Node order is
// significant and must match the source outline.
message OutlineLessonGroup {
  string title = 1;
  repeated OutlineNodeRef nodes = 2;
}
// Reusable weekly rhythm for a teaching-plan version. Weekdays use 0-6 for
// Sunday-Saturday. Live room types match the classroom service exactly:
// 0=one-to-one, 4=small class (default), 2=large class, 10=public class.
message TeachingPlanScheduleDefaults {
  string timezone = 1;
  repeated int32 weekdays = 2;
  string local_start_time = 3;
  int32 live_duration_minutes = 4;
  int32 live_room_type = 5;
}
message TeachingPlanManualLessonInput {
  string title = 1;
  string description = 2;
}
message TeachingPlanShareTaskInput {
  string title = 1;
  string play_url = 2;
  map<string, string> language_links = 3;
}
message TeachingPlanShareLessonInput {
  string title = 1;
  repeated TeachingPlanShareTaskInput tasks = 2;
}
message CreateTeachingPlanSetupRequest {
  string name = 1;
  string description = 2;
  int64 entry_course_id = 3;
  TeachingPlanSetupMode mode = 4;
  bool include_live = 5;
  bool include_ai = 6;
  int32 live_duration_minutes = 7;
  int32 initial_lesson_count = 8;
  repeated OutlineLessonGroup outline_lesson_groups = 9;
