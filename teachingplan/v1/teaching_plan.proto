syntax = "proto3";

package teachingplan.v1;

option go_package = "k12_backend/api/teachingplan/v1;v1";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service TeachingPlanService {
  rpc ListTeachingClasses(ListTeachingClassesRequest) returns (ListTeachingClassesResponse) {
    option (google.api.http) = {get: "/v1/admin/teaching-classes"};
  }
  rpc CreateTeachingClass(CreateTeachingClassRequest) returns (TeachingClass) {
    option (google.api.http) = {post: "/v1/admin/teaching-classes" body: "*"};
  }
  rpc UpdateTeachingClass(UpdateTeachingClassRequest) returns (TeachingClass) {
    option (google.api.http) = {patch: "/v1/admin/teaching-classes/{id}" body: "*"};
  }
  rpc ListTeachingClassMembers(ListTeachingClassMembersRequest) returns (ListTeachingClassMembersResponse) {
    option (google.api.http) = {get: "/v1/admin/teaching-classes/{class_id}/members"};
  }
  rpc AddTeachingClassMember(AddTeachingClassMemberRequest) returns (TeachingClassMember) {
    option (google.api.http) = {post: "/v1/admin/teaching-classes/{class_id}/members" body: "*"};
  }
  rpc RemoveTeachingClassMember(RemoveTeachingClassMemberRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/admin/teaching-classes/{class_id}/members/{member_id}"};
  }
  rpc ListTeachingPlanTemplates(ListTeachingPlanTemplatesRequest) returns (ListTeachingPlanTemplatesResponse) {
    option (google.api.http) = {get: "/v1/admin/teaching-plan-templates"};
  }
  rpc CreateTeachingPlanTemplate(CreateTeachingPlanTemplateRequest) returns (TeachingPlanTemplate) {
    option (google.api.http) = {post: "/v1/admin/teaching-plan-templates" body: "*"};
  }
  rpc GetTeachingPlanTemplate(GetTeachingPlanTemplateRequest) returns (TeachingPlanTemplateDetail) {
    option (google.api.http) = {get: "/v1/admin/teaching-plan-templates/{id}"};
  }
  rpc CreateTeachingPlanDraft(CreateTeachingPlanDraftRequest) returns (TeachingPlanVersion) {
    option (google.api.http) = {post: "/v1/admin/teaching-plan-templates/{template_id}/drafts" body: "*"};
  }
  rpc SaveTeachingPlanDraft(SaveTeachingPlanDraftRequest) returns (TeachingPlanVersion) {
    option (google.api.http) = {put: "/v1/admin/teaching-plan-template-versions/{version_id}" body: "*"};
  }
  rpc PublishTeachingPlanVersion(PublishTeachingPlanVersionRequest) returns (TeachingPlanVersion) {
    option (google.api.http) = {post: "/v1/admin/teaching-plan-template-versions/{version_id}/publish" body: "*"};
  }
  rpc InitializeTeachingPlanLessons(InitializeTeachingPlanLessonsRequest) returns (TeachingPlanVersion) {
    option (google.api.http) = {post: "/v1/admin/teaching-plan-template-versions/{version_id}/lessons:initialize" body: "*"};
  }
  rpc ListSchedulingResources(ListSchedulingResourcesRequest) returns (ListSchedulingResourcesResponse) {
    option (google.api.http) = {get: "/v1/admin/scheduling-resources"};
  }
  rpc BatchCreateClassPlanAssignments(BatchCreateClassPlanAssignmentsRequest) returns (BatchCreateClassPlanAssignmentsResponse) {
    option (google.api.http) = {post: "/v1/admin/class-plan-assignments/batch" body: "*"};
  }
  rpc ListClassPlanAssignments(ListClassPlanAssignmentsRequest) returns (ListClassPlanAssignmentsResponse) {
    option (google.api.http) = {get: "/v1/admin/teaching-classes/{class_id}/plan-assignments"};
  }
  rpc GetClassPlanTimeline(GetClassPlanTimelineRequest) returns (ClassPlanTimeline) {
    option (google.api.http) = {get: "/v1/admin/class-plan-assignments/{assignment_id}/timeline"};
  }
  rpc UpdateClassPlanAssignment(UpdateClassPlanAssignmentRequest) returns (ClassPlanAssignment) {
    option (google.api.http) = {patch: "/v1/admin/class-plan-assignments/{id}" body: "*"};
  }
  rpc PutClassPlanItemOverride(PutClassPlanItemOverrideRequest) returns (ClassPlanItemOverride) {
    option (google.api.http) = {put: "/v1/admin/class-plan-assignments/{assignment_id}/overrides/{item_id}" body: "*"};
  }
  rpc DeleteClassPlanItemOverride(DeleteClassPlanItemOverrideRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/admin/class-plan-assignments/{assignment_id}/overrides/{item_id}"};
  }
  rpc PutClassPlanLessonOverride(PutClassPlanLessonOverrideRequest) returns (ClassPlanLessonOverride) {
    option (google.api.http) = {put: "/v1/admin/class-plan-assignments/{assignment_id}/lesson-overrides/{lesson_id}" body: "*"};
  }
  rpc DeleteClassPlanLessonOverride(DeleteClassPlanLessonOverrideRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/admin/class-plan-assignments/{assignment_id}/lesson-overrides/{lesson_id}"};
  }
  rpc PublishClassPlanAssignment(PublishClassPlanAssignmentRequest) returns (ClassPlanAssignment) {
    option (google.api.http) = {post: "/v1/admin/class-plan-assignments/{assignment_id}/publish" body: "*"};
  }
  rpc GetMyCourseSchedule(GetMyCourseScheduleRequest) returns (GetMyCourseScheduleResponse) {
    option (google.api.http) = {get: "/v1/courses/{course_id}/schedule"};
  }
  rpc GetMyChapterSchedule(GetMyChapterScheduleRequest) returns (GetMyChapterScheduleResponse) {
    option (google.api.http) = {get: "/v1/courses/{course_id}/chapters/{chapter_id}/schedule"};
  }
  rpc GetMyLessonSchedule(GetMyLessonScheduleRequest) returns (GetMyLessonScheduleResponse) {
    option (google.api.http) = {get: "/v1/courses/{course_id}/lessons/{lesson_id}/schedule"};
  }
  rpc OpenLearningTask(OpenLearningTaskRequest) returns (OpenLearningTaskResponse) {
    option (google.api.http) = {
      post: "/v1/courses/{course_id}/lessons/{plan_lesson_id}/tasks/{plan_item_id}:open"
      body: "*"
      additional_bindings: {post: "/v1/courses/{course_id}/chapters/{chapter_id}/tasks/{plan_item_id}:open" body: "*"}
    };
  }
  rpc ReceiveOpenMAICProgressEvent(OpenMAICProgressEventRequest) returns (OpenMAICProgressEventResponse) {
    option (google.api.http) = {post: "/v1/integrations/openmaic/learning-progress/events" body: "*"};
  }
  rpc ReceiveLiveProgressEvent(LiveProgressEventRequest) returns (LiveProgressEventResponse) {
    option (google.api.http) = {post: "/v1/integrations/live/attendance/events" body: "*"};
  }
}

enum PlanResourceType {
  PLAN_RESOURCE_TYPE_UNSPECIFIED = 0;
  PLAN_RESOURCE_TYPE_COURSE = 1;
  PLAN_RESOURCE_TYPE_COURSEWARE = 2;
  PLAN_RESOURCE_TYPE_EXAM = 3;
  PLAN_RESOURCE_TYPE_LIVE = 4;
}

enum TaskProgressStatus {
  TASK_PROGRESS_STATUS_UNSPECIFIED = 0;
  TASK_PROGRESS_STATUS_NOT_STARTED = 1;
  TASK_PROGRESS_STATUS_IN_PROGRESS = 2;
  TASK_PROGRESS_STATUS_COMPLETED = 3;
}

enum TaskPresentationStatus {
  TASK_PRESENTATION_STATUS_UNSPECIFIED = 0;
  TASK_PRESENTATION_STATUS_AVAILABLE = 1;
  TASK_PRESENTATION_STATUS_LOCKED = 2;
  TASK_PRESENTATION_STATUS_PENDING_SYNC = 3;
  TASK_PRESENTATION_STATUS_LIVE_UPCOMING = 4;
  TASK_PRESENTATION_STATUS_LIVE_NOW = 5;
  TASK_PRESENTATION_STATUS_ATTENDANCE_INSUFFICIENT = 6;
  TASK_PRESENTATION_STATUS_MISSED = 7;
  TASK_PRESENTATION_STATUS_RESOURCE_UNAVAILABLE = 8;
}

enum LaunchMode {
  LAUNCH_MODE_UNSPECIFIED = 0;
  LAUNCH_MODE_IFRAME = 1;
  LAUNCH_MODE_NEW_TAB = 2;
}

enum TeachingRole {
  TEACHING_ROLE_UNSPECIFIED = 0;
  TEACHING_ROLE_LESSON = 1;
  TEACHING_ROLE_IN_CLASS_PRACTICE = 2;
  TEACHING_ROLE_HOMEWORK = 3;
  TEACHING_ROLE_ASSESSMENT = 4;
}

enum ScheduleMode {
  SCHEDULE_MODE_UNSPECIFIED = 0;
  SCHEDULE_MODE_RELATIVE = 1;
  SCHEDULE_MODE_ABSOLUTE = 2;
}

enum ResultVisibility {
  RESULT_VISIBILITY_UNSPECIFIED = 0;
  RESULT_VISIBILITY_IMMEDIATE = 1;
  RESULT_VISIBILITY_AFTER_DUE = 2;
  RESULT_VISIBILITY_HIDDEN = 3;
}

enum AnswerVisibility {
  ANSWER_VISIBILITY_UNSPECIFIED = 0;
  ANSWER_VISIBILITY_AFTER_SUBMIT = 1;
  ANSWER_VISIBILITY_AFTER_DUE = 2;
  ANSWER_VISIBILITY_HIDDEN = 3;
}

enum LateSubmissionPolicy {
  LATE_SUBMISSION_POLICY_UNSPECIFIED = 0;
  LATE_SUBMISSION_POLICY_REJECT = 1;
  LATE_SUBMISSION_POLICY_ALLOW = 2;
}

enum LifecycleStatus {
  LIFECYCLE_STATUS_UNSPECIFIED = 0;
  LIFECYCLE_STATUS_DRAFT = 1;
  LIFECYCLE_STATUS_ACTIVE = 2;
  LIFECYCLE_STATUS_ARCHIVED = 3;
  LIFECYCLE_STATUS_PUBLISHED = 4;
  LIFECYCLE_STATUS_SUPERSEDED = 5;
}

enum StudentLessonStatus {
  STUDENT_LESSON_STATUS_UNSPECIFIED = 0;
  STUDENT_LESSON_STATUS_LOCKED = 1;
  STUDENT_LESSON_STATUS_NOT_STARTED = 2;
  STUDENT_LESSON_STATUS_IN_PROGRESS = 3;
  STUDENT_LESSON_STATUS_COMPLETED = 4;
}

message PageInfo {
  int32 page = 1;
  int32 page_size = 2;
  int64 total = 3;
}

message TeachingClass {
  int64 id = 1;
  string code = 2;
  string name = 3;
  string timezone = 4;
  LifecycleStatus status = 5;
  string created_by = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message ListTeachingClassesRequest {
  int32 page = 1;
  int32 page_size = 2;
  LifecycleStatus status = 3;
}
message ListTeachingClassesResponse { repeated TeachingClass classes = 1; PageInfo page_info = 2; }
message CreateTeachingClassRequest { string code = 1; string name = 2; string timezone = 3; }
message UpdateTeachingClassRequest {
  int64 id = 1;
  string name = 2;
  string timezone = 3;
  LifecycleStatus status = 4;
}

message TeachingClassMember {
  int64 id = 1;
  int64 class_id = 2;
  string casdoor_subject = 3;
  int64 user_id = 4;
  string role = 5;
  string status = 6;
  google.protobuf.Timestamp joined_at = 7;
  google.protobuf.Timestamp removed_at = 8;
}
message ListTeachingClassMembersRequest { int64 class_id = 1; }
message ListTeachingClassMembersResponse { repeated TeachingClassMember members = 1; }
message AddTeachingClassMemberRequest {
  int64 class_id = 1;
  string casdoor_subject = 2;
  int64 user_id = 3;
  string role = 4;
}
message RemoveTeachingClassMemberRequest { int64 class_id = 1; int64 member_id = 2; }

message TeachingPlanTemplate {
  int64 id = 1;
  string code = 2;
  string name = 3;
  string description = 4;
  LifecycleStatus status = 5;
  int64 current_version_id = 6;
  int32 current_version_no = 7;
  int32 item_count = 8;
  int32 assignment_count = 9;
  string created_by = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  // Student-facing course detail page that displays this schedule.
  int64 entry_course_id = 13;
}

message ListTeachingPlanTemplatesRequest { int32 page = 1; int32 page_size = 2; LifecycleStatus status = 3; }
message ListTeachingPlanTemplatesResponse { repeated TeachingPlanTemplate templates = 1; PageInfo page_info = 2; }
message CreateTeachingPlanTemplateRequest { string code = 1; string name = 2; string description = 3; int64 entry_course_id = 4; }
message GetTeachingPlanTemplateRequest { int64 id = 1; }
message TeachingPlanTemplateDetail { TeachingPlanTemplate template = 1; repeated TeachingPlanVersion versions = 2; }
message CreateTeachingPlanDraftRequest { int64 template_id = 1; string change_summary = 2; }

message ExamPolicy {
  int32 attempt_limit = 1;
  double passing_score = 2;
  ResultVisibility result_visibility = 3;
  AnswerVisibility answer_visibility = 4;
  LateSubmissionPolicy late_submission_policy = 5;
}

message TeachingPlanItem {
  int64 id = 1;
  string title = 2;
  int32 sort_order = 3;
  PlanResourceType resource_type = 4;
  TeachingRole teaching_role = 5;
  int64 course_id = 6;
  int64 courseware_id = 7;
  int64 exam_paper_id = 8;
  int64 related_item_id = 9;
  ScheduleMode schedule_mode = 10;
  int32 relative_day = 11;
  int32 time_of_day_minutes = 12;
  google.protobuf.Timestamp absolute_unlock_at = 13;
  int32 due_offset_minutes = 14;
  bool has_due_offset = 15;
  bool required = 16;
  ExamPolicy exam_policy = 17;
  int64 chapter_id = 18;
  string live_course_id = 19;
  int64 plan_lesson_id = 20;
}

message TeachingPlanLesson {
  int64 id = 1;
  string title = 2;
  int32 lesson_no = 3;
  int32 sort_order = 4;
  int64 source_chapter_id = 5;
  ScheduleMode schedule_mode = 6;
  int32 relative_day = 7;
  int32 time_of_day_minutes = 8;
  google.protobuf.Timestamp absolute_unlock_at = 9;
  bool required = 10;
  repeated TeachingPlanItem items = 11;
}

message TeachingPlanVersion {
  int64 id = 1;
  int64 template_id = 2;
  int32 version_no = 3;
  int64 revision = 4;
  LifecycleStatus status = 5;
  string change_summary = 6;
  repeated TeachingPlanItem items = 7;
  string published_by = 8;
  google.protobuf.Timestamp published_at = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  repeated TeachingPlanLesson lessons = 12;
}

message SaveTeachingPlanDraftRequest {
  int64 version_id = 1;
  int64 revision = 2;
  repeated TeachingPlanItem items = 3;
  repeated TeachingPlanLesson lessons = 4;
}
message PublishTeachingPlanVersionRequest { int64 version_id = 1; int64 revision = 2; }
message InitializeTeachingPlanLessonsRequest {
  int64 version_id = 1;
  int64 revision = 2;
  int64 course_id = 3;
}

message CoursewareResource { int64 id = 1; int64 course_id = 2; string code = 3; string title = 4; string type = 5; int64 chapter_id = 6; }
message ChapterResource { int64 id = 1; string code = 2; string title = 3; int32 sort_order = 4; }
message CourseResource {
  int64 id = 1;
  string code = 2;
  string name = 3;
  string cover_image = 4;
  repeated CoursewareResource coursewares = 5;
  repeated ChapterResource chapters = 6;
}
message ExamPaperResource { int64 id = 1; string code = 2; string title = 3; string subject = 4; string level = 5; }
message LiveCourseResource {
  string id = 1;
  string title = 2;
  google.protobuf.Timestamp start_at = 3;
  google.protobuf.Timestamp end_at = 4;
  string status = 5;
}
message ListSchedulingResourcesRequest { string query = 1; PlanResourceType type = 2; int32 page = 3; int32 page_size = 4; }
message ListSchedulingResourcesResponse {
  repeated CourseResource courses = 1;
  repeated ExamPaperResource exam_papers = 2;
  PageInfo page_info = 3;
  repeated LiveCourseResource live_courses = 4;
}

message ClassPlanAssignment {
  int64 id = 1;
  int64 class_id = 2;
  int64 template_version_id = 3;
  google.protobuf.Timestamp class_start_at = 4;
  LifecycleStatus status = 5;
  int64 revision = 6;
  string created_by = 7;
  string published_by = 8;
  google.protobuf.Timestamp published_at = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message ClassAssignmentInput { int64 class_id = 1; google.protobuf.Timestamp class_start_at = 2; }
message BatchCreateClassPlanAssignmentsRequest {
  int64 template_version_id = 1;
  repeated ClassAssignmentInput classes = 2;
}
message ClassAssignmentResult {
  int64 class_id = 1;
  ClassPlanAssignment assignment = 2;
  string error_code = 3;
  string error_message = 4;
}
message BatchCreateClassPlanAssignmentsResponse { repeated ClassAssignmentResult results = 1; }
message ListClassPlanAssignmentsRequest { int64 class_id = 1; }
message ListClassPlanAssignmentsResponse { repeated ClassPlanAssignment assignments = 1; }
message UpdateClassPlanAssignmentRequest {
  int64 id = 1;
  int64 revision = 2;
  google.protobuf.Timestamp class_start_at = 3;
}

message ClassPlanItemOverride {
  int64 id = 1;
  int64 assignment_id = 2;
  int64 item_id = 3;
  google.protobuf.Timestamp unlock_at = 4;
  google.protobuf.Timestamp due_at = 5;
  bool has_due_at = 6;
  string reason = 7;
}
message PutClassPlanItemOverrideRequest {
  int64 assignment_id = 1;
  int64 item_id = 2;
  int64 assignment_revision = 3;
  google.protobuf.Timestamp unlock_at = 4;
  google.protobuf.Timestamp due_at = 5;
  bool has_due_at = 6;
  string reason = 7;
}
message DeleteClassPlanItemOverrideRequest { int64 assignment_id = 1; int64 item_id = 2; int64 assignment_revision = 3; }
message ClassPlanLessonOverride {
  int64 id = 1;
  int64 assignment_id = 2;
  int64 lesson_id = 3;
  google.protobuf.Timestamp unlock_at = 4;
  string reason = 5;
}
message PutClassPlanLessonOverrideRequest {
  int64 assignment_id = 1;
  int64 lesson_id = 2;
  int64 assignment_revision = 3;
  google.protobuf.Timestamp unlock_at = 4;
  string reason = 5;
}
message DeleteClassPlanLessonOverrideRequest {
  int64 assignment_id = 1;
  int64 lesson_id = 2;
  int64 assignment_revision = 3;
}
message PublishClassPlanAssignmentRequest { int64 assignment_id = 1; int64 revision = 2; }

message GetClassPlanTimelineRequest { int64 assignment_id = 1; }
message ClassPlanTimelineItem {
  TeachingPlanItem item = 1;
  google.protobuf.Timestamp unlock_at = 2;
  google.protobuf.Timestamp due_at = 3;
  bool has_due_at = 4;
  bool overridden = 5;
  string launch_url = 6;
  string learning_assignment_id = 7;
  TaskProgressStatus progress_status = 8;
  TaskPresentationStatus presentation_status = 9;
  LaunchMode launch_mode = 10;
  double progress_ratio = 11;
  double score = 12;
  bool has_score = 13;
}
message ClassPlanTimeline {
  ClassPlanAssignment assignment = 1;
  TeachingClass teaching_class = 2;
  string timezone = 3;
  repeated ClassPlanTimelineItem items = 4;
}

message GetMyCourseScheduleRequest { int64 course_id = 1; }
message GetMyCourseScheduleResponse {
  bool has_schedule = 1;
  ClassPlanTimeline timeline = 2;
  repeated ChapterScheduleSummary chapters = 3;
  repeated LessonScheduleSummary lessons = 4;
}

message LessonScheduleSummary {
  int64 lesson_id = 1;
  int32 lesson_no = 2;
  string lesson_title = 3;
  int64 source_chapter_id = 4;
  int32 required_item_count = 5;
  int32 completed_required_item_count = 6;
  google.protobuf.Timestamp unlock_at = 7;
  StudentLessonStatus status = 8;
  bool required = 9;
}

message ClassPlanLessonTimeline {
  ClassPlanAssignment assignment = 1;
  TeachingClass teaching_class = 2;
  string timezone = 3;
  TeachingPlanLesson lesson = 4;
  LessonScheduleSummary summary = 5;
  repeated ClassPlanTimelineItem items = 6;
}

message ChapterScheduleSummary {
  int64 chapter_id = 1;
  string chapter_title = 2;
  int32 required_item_count = 3;
  int32 completed_required_item_count = 4;
  google.protobuf.Timestamp earliest_unlock_at = 5;
  bool has_schedule = 6;
  bool completed = 7;
}

message GetMyChapterScheduleRequest {
  int64 course_id = 1;
  int64 chapter_id = 2;
}
message GetMyChapterScheduleResponse {
  bool has_schedule = 1;
  ChapterScheduleSummary chapter = 2;
  ClassPlanTimeline timeline = 3;
}

message GetMyLessonScheduleRequest {
  int64 course_id = 1;
  int64 lesson_id = 2;
}
message GetMyLessonScheduleResponse {
  bool has_schedule = 1;
  LessonScheduleSummary lesson = 2;
  ClassPlanLessonTimeline timeline = 3;
}

message OpenLearningTaskRequest {
  int64 course_id = 1;
  int64 chapter_id = 2;
  int64 plan_item_id = 3;
  int64 plan_lesson_id = 4;
}
message OpenLearningTaskResponse {
  string launch_url = 1;
  LaunchMode launch_mode = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message OpenMAICProgressEventRequest {
  string event_id = 1;
  string event_type = 2;
  string schema_version = 3;
  google.protobuf.Timestamp occurred_at = 4;
  string assignment_id = 5;
  string casdoor_user_id = 6;
  string course_id = 7;
  string scene_id = 8;
  int32 completed_scene_count = 9;
  int32 required_scene_count = 10;
  bool course_completed = 11;
  int64 revision = 12;
}
message OpenMAICProgressEventResponse { bool accepted = 1; bool duplicate = 2; }

message LiveProgressEventRequest {
  string event_id = 1;
  string event_type = 2;
  string schema_version = 3;
  google.protobuf.Timestamp occurred_at = 4;
  string live_course_id = 5;
  string casdoor_user_id = 6;
  int64 valid_online_seconds = 7;
  int64 effective_live_seconds = 8;
  double attendance_ratio = 9;
  bool completed = 10;
  int64 revision = 11;
}
message LiveProgressEventResponse { bool accepted = 1; bool duplicate = 2; }
