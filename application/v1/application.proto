syntax = "proto3";

package application.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "document/v1/document.proto";
import "applicant/v1/applicant.proto";

option go_package = "k12_backend/api/application/v1";

// ApplicationService 申请服务
service ApplicationService {
  // CreateApplication 创建申请记录
  rpc CreateApplication(CreateApplicationRequest) returns (Application) {
    option (google.api.http) = {
      post: "/api/v1/application"
      body: "*"
    };
  }
  
  // GetApplication 获取申请记录
  rpc GetApplication(GetApplicationRequest) returns (Application) {
    option (google.api.http) = {
      get: "/api/v1/application/{id}"
    };
  }
  
  // UpdateApplication 更新申请记录
  rpc UpdateApplication(UpdateApplicationRequest) returns (Application) {
    option (google.api.http) = {
      put: "/api/v1/application/{id}"
      body: "*"
    };
  }
  
  // ListApplications 列出申请列表
  rpc ListApplications(ListApplicationsRequest) returns (ListApplicationsResponse) {
    option (google.api.http) = {
      get: "/api/v1/applications"
    };
  }
  
  // ListAllApplications 列出所有申请列表（管理员用）
  rpc ListAllApplications(ListApplicationsRequest) returns (ListApplicationsResponse) {
    option (google.api.http) = {
      get: "/api/v1/applications/all"
    };
  }
  
  // DeleteApplication 删除申请记录
  rpc DeleteApplication(DeleteApplicationRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/api/v1/application/{id}"
    };
  }
  
  // SubmitApplication 提交申请
  rpc SubmitApplication(SubmitApplicationRequest) returns (Application) {
    option (google.api.http) = {
      post: "/api/v1/application/{id}/submit"
      body: "*"
    };
  }
  
  // SubmitCompleteApplication 提交完整申请（同时处理申请人和申请记录）
  rpc SubmitCompleteApplication(SubmitCompleteApplicationRequest) returns (Application) {
    option (google.api.http) = {
      post: "/api/v1/application/submit-complete"
      body: "*"
    };
  }
  
  // ReviewApplication 审核申请
  rpc ReviewApplication(ReviewApplicationRequest) returns (Application) {
    option (google.api.http) = {
      post: "/api/v1/application/{id}/review"
      body: "*"
    };
  }
}

// Application 申请记录
message Application {
  string id = 1;
  string applicant_id = 2;
  string status = 3;
  string education_background = 4;
  string previous_school = 5;
  string chinese_level = 6;
  string hsk4 = 7;
  string hsk5 = 8;
  string english_level = 9;
  string ielts_score = 10;
  string toefl_score = 11;
  string course_type = 12;
  google.protobuf.Timestamp study_start_date = 13;
  google.protobuf.Timestamp study_end_date = 14;
  string funding_source = 15;
  string application_reason = 16;
  bool is_chinese_heritage = 17;
  string chinese_heritage_details = 18;
  string scholarship_application = 19;
  string hsk_level = 20;
  string hsk_score = 21;
  string notes = 22;
  string scholarship_notes = 23;
  google.protobuf.Timestamp submitted_at = 24;
  google.protobuf.Timestamp reviewed_at = 25;
  google.protobuf.Timestamp created_at = 26;
  google.protobuf.Timestamp updated_at = 27;
  // 文件字段
  string passport = 28;
  string photo = 29;
  string medical = 30;
  string education = 31;
  string guardian = 32;
  string guardian_id = 33;
  string express = 34;
  repeated string award_cert = 35;
  string middle_school_diploma = 36;
  string transcript = 37;
  string hsk_certificate = 38;
  string hsk4_certificate = 39;
  string hsk5_certificate = 40;
  repeated string competition_awards = 41;
  string ielts_certificate = 42;
  string toefl_certificate = 43;
  repeated document.v1.Document documents = 44;
  applicant.v1.Applicant applicant = 45;
  string self_introduction_video = 46;
}

// CreateApplicationRequest 创建申请请求
message CreateApplicationRequest {
  string applicant_id = 1;
  string education_background = 2;
  string previous_school = 3;
  string chinese_level = 4;
  string hsk4 = 5;
  string hsk5 = 6;
  string english_level = 7;
  string ielts_score = 8;
  string toefl_score = 9;
  string course_type = 10;
  string funding_source = 11;
  string application_reason = 12;
  bool is_chinese_heritage = 13;
  string chinese_heritage_details = 14;
  string scholarship_application = 15;
  string hsk_level = 16;
  string hsk_score = 17;
  string notes = 18;
  string scholarship_notes = 19;
  google.protobuf.Timestamp study_start_date = 20;
  google.protobuf.Timestamp study_end_date = 21;
  // 文件字段
  string passport = 22;
  string photo = 23;
  string medical = 24;
  string education = 25;
  string guardian = 26;
  string guardian_id = 27;
  string express = 28;
  repeated string award_cert = 29;
  string middle_school_diploma = 30;
  string transcript = 31;
  string hsk_certificate = 32;
  string hsk4_certificate = 33;
  string hsk5_certificate = 34;
  repeated string competition_awards = 35;
  string ielts_certificate = 36;
  string toefl_certificate = 37;
  string self_introduction_video = 38;
}

// GetApplicationRequest 获取申请请求
message GetApplicationRequest {
  string id = 1;
}

// UpdateApplicationRequest 更新申请请求
message UpdateApplicationRequest {
  string id = 1;
  string applicant_id = 2;
  string education_background = 3;
  string previous_school = 4;
  string chinese_level = 5;
  string hsk4 = 6;
  string hsk5 = 7;
  string english_level = 8;
  string ielts_score = 9;
  string toefl_score = 10;
  string course_type = 11;
  string funding_source = 12;
  string application_reason = 13;
  bool is_chinese_heritage = 14;
  string chinese_heritage_details = 15;
  string scholarship_application = 16;
  string hsk_level = 17;
  string hsk_score = 18;
  string notes = 19;
  string scholarship_notes = 20;
  google.protobuf.Timestamp study_start_date = 21;
  google.protobuf.Timestamp study_end_date = 22;
  // 文件字段
  string passport = 23;
  string photo = 24;
  string medical = 25;
  string education = 26;
  string guardian = 27;
  string guardian_id = 28;
  string express = 29;
  repeated string award_cert = 30;
  string middle_school_diploma = 31;
  string transcript = 32;
  string hsk_certificate = 33;
  string hsk4_certificate = 34;
  string hsk5_certificate = 35;
  repeated string competition_awards = 36;
  string ielts_certificate = 37;
  string toefl_certificate = 38;
  string self_introduction_video = 39;
}

// ListApplicationsRequest 列出申请请求
message ListApplicationsRequest {
  int32 page = 1;
  int32 page_size = 2;
  string keyword = 3;
  string status = 4;
  string applicant_id = 5;
  string course_type = 6;
  string nationality = 7;
}

// ListApplicationsResponse 列出申请响应
message ListApplicationsResponse {
  repeated Application applications = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// DeleteApplicationRequest 删除申请请求
message DeleteApplicationRequest {
  string id = 1;
}

// SubmitApplicationRequest 提交申请请求
message SubmitApplicationRequest {
  string id = 1;
}

// ReviewApplicationRequest 审核申请请求
message ReviewApplicationRequest {
  string id = 1;
  string status = 2;
  string notes = 3;
  bool isScholarshipReview = 4;
  string scholarshipNotes = 5;
}

// SubmitCompleteApplicationRequest 提交完整申请请求
message SubmitCompleteApplicationRequest {
  // 申请人信息
  string user_id = 1;
  string family_name = 2;
  string middle_name = 3;
  string given_name = 4;
  string chinese_name = 5;
  google.protobuf.Timestamp birth_date = 6;
  string birth_country = 7;
  string birth_city = 8;
  string nationality = 9;
  string gender = 10;
  string marital_status = 11;
  string religion = 12;
  string passport_number = 13;
  google.protobuf.Timestamp passport_expiry = 14;
  string home_phone = 15;
  string email = 16;
  string wechat = 17;
  string qq = 18;
  string home_address = 19;
  bool has_contact = 20;
  string contact_name = 21;
  string contact_relationship = 22;
  string contact_phone = 23;
  string contact_email = 24;
  string contact_type = 25;
  bool is_chinese_heritage = 26;
  string chinese_heritage_details = 27;
  string family_members = 28; // JSON string
  string mailing_address = 29;
  string mailing_zip = 30;
  string mailing_country = 31;
  string height = 32;
  string weight = 33;
  string waist = 34;
  
  // 申请记录信息
  string application_id = 35; // 编辑模式时提供
  string education_background = 36;
  string previous_school = 37;
  string chinese_level = 38;
  string hsk4 = 39;
  string hsk5 = 40;
  string english_level = 41;
  string ielts_score = 42;
  string toefl_score = 43;
  string course_type = 44;
  google.protobuf.Timestamp study_start_date = 45;
  google.protobuf.Timestamp study_end_date = 46;
  string funding_source = 47;
  string application_reason = 48;
  string scholarship_application = 49;
  string hsk_level = 50;
  string hsk_score = 51;
  string notes = 52;
  
  // 文件字段
  string passport = 53;
  string photo = 54;
  string medical = 55;
  string education = 56;
  string guardian = 57;
  string guardian_id = 58;
  string express = 59;
  repeated string award_cert = 60;
  string middle_school_diploma = 61;
  string transcript = 62;
  string hsk_certificate = 63;
  string hsk4_certificate = 64;
  string hsk5_certificate = 65;
  repeated string competition_awards = 66;
  string ielts_certificate = 67;
  string toefl_certificate = 68;
  string self_introduction_video = 69;
}
