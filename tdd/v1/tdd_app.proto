syntax = "proto3";

package tdd.v1;

option go_package = "k12_backend/api/tdd/v1;v1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "tdd/v1/tdd.proto";

// TddAppService App 端查询：大组列表 → 大组详情 → 细分集合详情 → 单条目详情（HTTP/gRPC）。
service TddAppService {
  // 分页列出已发布的大组（支持排序与个性化推荐置顶）。
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse) {
    option (google.api.http) = {
      get: "/v1/tdd/app/groups"
    };
  }

  // 单个大组详情（含细分集合概览）。
  rpc GetGroup(GetGroupRequest) returns (GetGroupResponse) {
    option (google.api.http) = {
      get: "/v1/tdd/app/groups/{group_id}"
    };
  }

  // 细分集合详情 + 顶层条目 + 章节树（条目是否含 structured_paper/answers 由 include 参数控制）。
  // 如果请求带合法用户 token，每个 TddItemInfo 会附带用户的完成状态与最近得分。
  rpc GetCollection(GetCollectionRequest) returns (GetCollectionResponse) {
    option (google.api.http) = {
      get: "/v1/tdd/app/collections/{collection_id}"
    };
  }

  // 单个条目详情（默认返回摘要与结构化试卷；答案是否返回由 include_answer 控制）。
  rpc GetItem(GetItemRequest) returns (GetItemResponse) {
    option (google.api.http) = {
      get: "/v1/tdd/app/items/{item_id}"
    };
  }

  // 按条目返回打平后的题目列表（来自 tdd_item_question，无 pages/sections 嵌套）。
  rpc ListItemQuestions(ListItemQuestionsRequest) returns (ListItemQuestionsResponse) {
    option (google.api.http) = {
      get: "/v1/tdd/app/items/{item_id}/questions"
    };
  }

  // 保存/更新用户在某条目上的草稿与阶段（需登录）。
  rpc SaveUserItemProgress(SaveUserItemProgressRequest) returns (SaveUserItemProgressResponse) {
    option (google.api.http) = {
      put: "/v1/tdd/app/items/{item_id}/progress"
      body: "*"
    };
  }

  // 拉取用户在某条目上的草稿与阶段（需登录）。
  rpc GetUserItemProgress(GetUserItemProgressRequest) returns (GetUserItemProgressResponse) {
    option (google.api.http) = {
      get: "/v1/tdd/app/items/{item_id}/progress"
    };
  }

  // 提交答卷并由服务端判分；成功后记录当日做题并可用于连续签到统计（需登录）。
  rpc SubmitTddAttempt(SubmitTddAttemptRequest) returns (SubmitTddAttemptResponse) {
    option (google.api.http) = {
      post: "/v1/tdd/app/items/{item_id}/attempts"
      body: "*"
    };
  }

  // 按条目聚合各题正误次数等（需登录）。
  rpc GetUserItemStats(GetUserItemStatsRequest) returns (GetUserItemStatsResponse) {
    option (google.api.http) = {
      get: "/v1/tdd/app/items/{item_id}/stats"
    };
  }

  // 当前用户连续做题/签到天数（需登录）。
  rpc GetPracticeStreak(GetPracticeStreakRequest) returns (GetPracticeStreakResponse) {
    option (google.api.http) = {
      get: "/v1/tdd/app/practice/streak"
    };
  }

  // 获取当前用户学习偏好（需登录）。
  rpc GetUserPreferences(GetUserPreferencesRequest) returns (GetUserPreferencesResponse) {
    option (google.api.http) = {
      get: "/v1/tdd/app/user/preferences"
    };
  }

  // 更新学习偏好（需登录）。
  rpc UpdateUserPreferences(UpdateUserPreferencesRequest) returns (UpdateUserPreferencesResponse) {
    option (google.api.http) = {
      put: "/v1/tdd/app/user/preferences"
      body: "*"
    };
  }

  // 当前用户在指定细分集合下的进度与得分汇总（各条目草稿阶段 + 最近一次交卷得分；需登录）。
  rpc GetUserCollectionProgress(GetUserCollectionProgressRequest) returns (GetUserCollectionProgressResponse) {
    option (google.api.http) = {
      get: "/v1/tdd/app/collections/{collection_id}/user-progress"
    };
  }

  // 成绩/学习概览：累计经验、答题数、交卷次数、连续打卡等（需登录）。
  rpc GetUserLearningSummary(GetUserLearningSummaryRequest) returns (GetUserLearningSummaryResponse) {
    option (google.api.http) = {
      get: "/v1/tdd/app/user/learning-summary"
    };
  }

  // 活动打卡热力图：按日交卷次数 + 强度档位（Git 贡献图风格；需登录）。
  rpc GetUserActivityHeatmap(GetUserActivityHeatmapRequest) returns (GetUserActivityHeatmapResponse) {
    option (google.api.http) = {
      get: "/v1/tdd/app/user/activity-heatmap"
    };
  }

  // 交卷历史（考试/试卷记录；支持按 item/collection 过滤；需登录）。
  rpc ListUserAttemptHistory(ListUserAttemptHistoryRequest) returns (ListUserAttemptHistoryResponse) {
    option (google.api.http) = {
      get: "/v1/tdd/app/user/attempt-history"
    };
  }

  // 推荐位大组列表（按 SaaS 推荐位排序，关联当前用户进度；需登录可选）。
  rpc ListFeaturedGroups(ListFeaturedGroupsRequest) returns (ListFeaturedGroupsResponse) {
    option (google.api.http) = {
      get: "/v1/tdd/app/featured-groups"
    };
  }

  // 查看某次交卷的每题详情（溯源；需登录）。
  rpc GetAttemptDetail(GetAttemptDetailRequest) returns (GetAttemptDetailResponse) {
    option (google.api.http) = {
      get: "/v1/tdd/app/attempts/{attempt_id}"
    };
  }
}

// ---------- ListGroups ----------

message ListGroupsRequest {
  int32 page_size = 1;   // 每页条数，<=0 时使用服务端默认
  string page_token = 2; // 下一页游标，由上次响应的 next_page_token 回填；首页留空
  // 排序方式：空/SORT_DEFAULT = 服务端默认排序；SORT_UPDATED = 按更新时间；SORT_FEATURED = 按推荐位。
  string sort_by = 3;
}

message ListGroupsResponse {
  repeated TddGroupInfo groups = 1; // 当前页大组列表
  string next_page_token = 2;       // 下一页游标；空表示没有更多数据
}

// ---------- GetGroup ----------

message GetGroupRequest {
  string group_id = 1; // 大组 ID
}

message GetGroupResponse {
  TddGroupInfo group = 1;
}

// ---------- GetCollection ----------

message GetCollectionRequest {
  string collection_id = 1; // 细分集合 ID

  // true：返回每条目的 structured_paper（整卷结构化内容）；false：不返回该字段以减小体积。
  bool include_detail = 2;

  // true：返回 answers 映射；false：不返回答案与解析配置。
  bool include_answer = 3;
}

message GetCollectionResponse {
  TddCollectionInfo collection = 1; // 集合元信息

  // 未挂载到任何章节的顶层条目（与 PushCollectionRequest.items 对应）。
  // 如果请求带合法用户 token，每条 TddItemInfo 会携带 completed/last_score/attempt_count/user_stage。
  repeated TddItemInfo items = 2;

  // 章节树；每个节点含本层直接条目，子章节在 sub_sections 中。
  repeated SectionTreeNode sections = 3;
}

// App 侧章节树节点，结构与推送侧 SectionDetail 对应。
message SectionTreeNode {
  string section_id = 1;
  string name = 2;
  string description = 3;
  int32 sort_order = 4;
  string parent_id = 5;

  // 直接挂在本节点下的条目（不含子章节中的条目）。
  repeated TddItemInfo items = 6;

  // 子章节。
  repeated SectionTreeNode sub_sections = 7;
}

// ---------- GetItem ----------

message GetItemRequest {
  string item_id = 1;       // 条目 ID
  bool include_answer = 2; // true：返回 answers；false：不返回
}

message GetItemResponse {
  TddItemInfo item = 1;
}

// ---------- ListItemQuestions（扁平题目） ----------

message ListItemQuestionsRequest {
  string item_id = 1;
  // true：返回答案、解析、正确选项等；false：仅题干/选项/材料等展示用内容。
  bool include_answer = 2;
}

message ListItemQuestionsResponse {
  string item_id = 1;
  repeated TddItemQuestionInfo questions = 2;
  // 来自 tdd_items.paper_summary_json（与 TddPaperSummary.subject 一致）。
  string subject = 3;
  // 来自 paper_summary_json，如「高中」。
  string grade_level = 4;
}

// 单题一行，与库表 tdd_item_question 对齐；子题通过 parent_hash_id 挂父题。
message TddItemQuestionInfo {
  string hash_id = 1;
  string parent_hash_id = 2;
  bool is_group = 3;
  int32 sort_order = 4;
  string section_title = 5;
  string section_score_info = 6;
  string number = 7;
  string type = 8;
  string type_cn = 9;
  double score = 10;
  string question_text = 11;
  string question_text_format = 12;
  string material = 13;
  string material_format = 14;
  // []TddParserOption JSON，与 structured_paper 中一致。
  string options_json = 15;
  // []TddParserQuestionImage JSON。
  string images_json = 16;
  // 以下字段仅在 include_answer=true 时填充（question_type 除外，便于 UI 区分客观/主观）。
  string answer = 17;
  string answer_analysis = 18;
  repeated string correct_keys = 19;
  string scoring_rule = 20;
  string match_rule = 21;
  string question_type = 22;
  double subjective_default_ratio = 23;
  string explanation = 24;
}

// ---------- 用户进度（草稿/阶段） ----------

message SaveUserItemProgressRequest {
  string item_id = 1; // path
  // 客户端自定义阶段，如 answering、review。
  string stage = 2;
  // key=题目 hash_id，value=用户作答（选项拼接或文本）。
  map<string, string> user_answers = 3;
  // 可选扩展 JSON。
  string extra_json = 4;
}

message SaveUserItemProgressResponse {
  bool success = 1;
}

message GetUserItemProgressRequest {
  string item_id = 1;
}

message GetUserItemProgressResponse {
  string stage = 1;
  map<string, string> user_answers = 2;
  string extra_json = 3;
  google.protobuf.Timestamp updated_at = 4;
}

// ---------- 交卷与评分 ----------

message SubmitTddAttemptRequest {
  string item_id = 1;
  map<string, string> user_answers = 2;
  // 本次作答耗时（秒），由客户端上报。
  int32 duration_sec = 3;
}

message SubmitTddAttemptResponse {
  double total_score = 1;
  double max_score = 2;
  int64 attempt_id = 3;
  repeated TddQuestionResult question_results = 4;
  // 本次交卷是否包含主观题（前端可据此提示"部分题目待人工批改"）。
  bool has_subjective_questions = 5;
}

message TddQuestionResult {
  string hash_id = 1;
  bool is_correct = 2;
  double earned_score = 3;
  string user_answer = 4;
  repeated string correct_keys = 5;
  // 本题满分值。
  double max_score = 6;
  // 题目类型：objective / subjective。
  string question_type = 7;
  // 本题解析。
  string explanation = 8;
}

// ---------- 按卷统计 ----------

message GetUserItemStatsRequest {
  string item_id = 1;
}

message GetUserItemStatsResponse {
  repeated TddQuestionStat question_stats = 1;
}

message TddQuestionStat {
  string hash_id = 1;
  int32 correct_count = 2;
  int32 wrong_count = 3;
  bool last_is_correct = 4;
}

// ---------- 细分集合：当前用户进度与得分 ----------

message GetUserCollectionProgressRequest {
  string collection_id = 1;
}

message GetUserCollectionProgressResponse {
  string collection_id = 1;
  int32 total_item_count = 2;      // 集合内条目总数
  int32 attempted_item_count = 3;  // 至少交卷过一次的条目数
  double sum_last_total_score = 4; // 各条目「最近一次交卷」得分之和（仅统计已交卷条目）
  double sum_last_max_score = 5;   // 同上最近一次卷面满分之和
  repeated UserItemProgressEntry items = 6;
}

// 单条目：草稿状态 + 最近一次交卷得分（多次交卷取 submitted_at 最新）。
message UserItemProgressEntry {
  string item_id = 1;
  string title = 2;
  string stage = 3; // 草稿阶段，无草稿为空
  bool has_draft = 4;
  google.protobuf.Timestamp draft_updated_at = 5;
  int32 attempt_count = 6; // 该条目累计交卷次数
  double last_total_score = 7;
  double last_max_score = 8;
  google.protobuf.Timestamp last_submitted_at = 9;
  // 历史最高得分。
  double best_total_score = 10;
  // 历史最高得分对应卷面满分。
  double best_max_score = 11;
}

// ---------- 成绩 / 学习概览 ----------

message GetUserLearningSummaryRequest {
}

// total_experience_points：全部交卷中单题 earned_score 累计（与累计卷面得分一致，重考重复累计）。
message GetUserLearningSummaryResponse {
  double total_experience_points = 1;
  int64 total_questions_answered = 2;   // 所有交卷中作答过的题目记录条数（含重考）
  int64 total_attempt_count = 3;        // 交卷次数
  int64 distinct_paper_count = 4;       // 至少交卷过一次的试卷条目数（item 去重）
  int32 current_streak = 5;             // 连续有做题记录的天数（与 GetPracticeStreak 一致）
  string last_practice_date = 6;        // YYYY-MM-DD，最近一次有做题记录的日期
}

// ---------- 活动热力图（按练习时区切日） ----------

message GetUserActivityHeatmapRequest {
  // 起止日期（含）YYYY-MM-DD；均空则默认最近 365 天至今日。
  string start_date = 1;
  string end_date = 2;
}

message GetUserActivityHeatmapResponse {
  // 服务端切日使用的 IANA 时区名（与配置 practice_timezone 一致）。
  string practice_timezone = 1;
  // 区间内每个自然日一行（含无交卷的 0），便于前端直接铺网格。
  repeated DailyActivityCell days = 2;
}

// activity_level：0 无；1–4 随当日交卷次数升高（用于配色）。
message DailyActivityCell {
  string date = 1;              // YYYY-MM-DD
  int32 submission_count = 2;   // 当日交卷次数
  int32 activity_level = 3;     // 0–4
}

// ---------- 交卷历史 ----------

message ListUserAttemptHistoryRequest {
  int32 page_size = 1;   // <=0 时用服务端默认
  string page_token = 2; // 下一页：上次响应的 next_page_token
  // 可选过滤：仅查看此 item 的交卷记录。
  string item_id = 3;
  // 可选过滤：仅查看此集合下交卷记录。
  string collection_id = 4;
}

message ListUserAttemptHistoryResponse {
  repeated UserAttemptHistoryEntry attempts = 1;
  string next_page_token = 2;
}

message UserAttemptHistoryEntry {
  int64 attempt_id = 1;
  string item_id = 2;
  string item_title = 3;
  string collection_id = 4;
  double total_score = 5;
  double max_score = 6;
  google.protobuf.Timestamp submitted_at = 7;
  // 本次作答耗时（秒）。
  int32 duration_sec = 8;
}

// ---------- 连续做题 ----------

message GetPracticeStreakRequest {
}

message GetPracticeStreakResponse {
  int32 current_streak = 1;
  // 最近一次有做题记录的日期 YYYY-MM-DD（练习时区）。
  string last_practice_date = 2;
}

// ---------- 用户偏好 ----------

message GetUserPreferencesRequest {
}

message GetUserPreferencesResponse {
  UserPreferences preferences = 1;
}

message UpdateUserPreferencesRequest {
  UserPreferences preferences = 1;
}

message UpdateUserPreferencesResponse {
  bool success = 1;
}

// 年纪/年级、国家、地区、学校；空字符串表示未设置。
message UserPreferences {
  string grade_level = 1;
  string country = 2;
  string region = 3;
  string school = 4;
}

// ---------- 推荐位大组 ----------

message ListFeaturedGroupsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListFeaturedGroupsResponse {
  repeated FeaturedGroupEntry groups = 1;
  string next_page_token = 2;
}

message FeaturedGroupEntry {
  TddGroupInfo group = 1;
  int32 featured_order = 2; // SaaS 推荐位排序值（>=1，越小越靠前）

  // 以下字段仅在请求含合法用户 token 时填充 ↓
  int32 total_item_count = 3;     // 整个大组下条目总数
  int32 completed_item_count = 4; // 至少交卷过一次的条目数

  // 当前进度 item（用户最近操作过草稿、或最近交卷的 item）。
  FeaturedProgressItem current_item = 5;
  // 下一个待完成 item（按 sort_order 排列的首个未完成）。
  FeaturedProgressItem next_item = 6;
  // 整个大组是否已全部完成。
  bool all_completed = 7;
}

message FeaturedProgressItem {
  string item_id = 1;
  string title = 2;
  string collection_id = 3;
  string collection_name = 4;
  double last_score = 5;
  double max_score = 6;
}

// ---------- 交卷详情溯源 ----------

message GetAttemptDetailRequest {
  int64 attempt_id = 1;
}

message GetAttemptDetailResponse {
  int64 attempt_id = 1;
  string item_id = 2;
  string item_title = 3;
  string collection_id = 4;
  double total_score = 5;
  double max_score = 6;
  google.protobuf.Timestamp submitted_at = 7;
  int32 duration_sec = 8;
  repeated TddQuestionResult question_results = 9;
}

// ---------- 共用视图（与推送侧消息字段语义对齐） ----------

message TddGroupInfo {
  string group_id = 1;
  string name = 2;
  string description = 3;
  string icon_url = 4;
  repeated CollectionSummary collections = 5; // 该大组下细分集合概览
  google.protobuf.Timestamp updated_at = 6;   // 服务端最近更新时间
  // SaaS 推荐位排序值；0=不上推荐位。
  int32 featured_order = 7;
  // 请求带合法用户且本大组内条目与用户偏好匹配时为 true。
  bool recommended_for_you = 8;
}

message TddCollectionInfo {
  string collection_id = 1;
  string group_id = 2;
  string name = 3;
  string description = 4;
  int32 sort_order = 5;   // 在大组或业务侧约定的排序
  int32 item_count = 6;   // 集合下条目总数（含各章节内）
  google.protobuf.Timestamp updated_at = 7;
  // 是否标记为 NEW（到期自动 false）。
  bool is_new = 8;
}

// 条目对外视图：paper_summary / structured_paper / answers 与推送侧 TddItem 一致；是否填充由查询接口的 include 标志决定。
message TddItemInfo {
  reserved 8, 9; // 与历史/对齐预留，勿分配字段号

  string item_id = 1;
  string collection_id = 2;
  string source_type = 3; // 与推送侧 source_type 一致
  string source_id = 4;   // 与推送侧 source_id 一致
  string title = 5;
  int32 sort_order = 6;

  // 空：顶层条目；非空：所属章节 section_id。
  string section_id = 7;

  // 列表/摘要。
  TddPaperSummary paper_summary = 10;

  // 整卷结构化内容（大字段；GetCollection 受 include_detail 控制）。
  TddStructuredPaper structured_paper = 11;

  // 答案与解析配置（GetCollection 受 include_answer 控制；GetItem 受 include_answer 控制）。
  map<string, TddAnswerConfig> answers = 12;

  google.protobuf.Timestamp updated_at = 15;

  // 与推送侧 TddItem 一致；用于与用户偏好匹配（见 GetCollection 置顶说明）。
  string pref_grade_level = 16;
  string pref_country = 17;
  string pref_region = 18;
  string pref_school = 19;

  // 请求带合法用户且本条目与用户偏好匹配（含 exam_meta.tags 中 Region:/Grade: 等前缀标签）时为 true。
  bool recommended_for_you = 20;

  // ---- 以下字段仅在请求带合法用户 token 时填充 ↓ ----

  // 是否已完成（至少提交过一次考试）。
  bool completed = 21;
  // 最近一次提交得分。
  double last_score = 22;
  // 最近一次提交满分。
  double last_max_score = 23;
  // 该 item 累计提交次数。
  int32 attempt_count = 24;
  // 草稿阶段（如 answering/review），空表示无草稿。
  string user_stage = 25;
}
