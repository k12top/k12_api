syntax = "proto3";

package auth.v1;

import "google/api/annotations.proto";

option go_package = "k12_backend/api/auth/v1;v1";

service Auth {
  rpc Login (LoginRequest) returns (LoginReply) {
    option (google.api.http) = {
      post: "/api/v1/auth/login"
      body: "*"
    };
  }
  rpc RefreshToken (RefreshTokenRequest) returns (RefreshTokenReply) {
    option (google.api.http) = {
      post: "/api/v1/auth/refresh"
      body: "*"
    };
  }
  rpc ListUsers (ListUsersRequest) returns (ListUsersReply) {
    option (google.api.http) = {
      get: "/api/v1/auth/users"
    };
  }
  rpc UpdateUserRole (UpdateUserRoleRequest) returns (UpdateUserRoleReply) {
    option (google.api.http) = {
      put: "/api/v1/auth/users/{id}/role"
      body: "*"
    };
  }
  rpc DeleteUser (DeleteUserRequest) returns (DeleteUserReply) {
    option (google.api.http) = {
      delete: "/api/v1/auth/users/{id}"
    };
  }
  rpc ListRoles (ListRolesRequest) returns (ListRolesReply) {
    option (google.api.http) = {
      get: "/api/v1/auth/roles"
    };
  }
}

message ListRolesRequest {
}

message ListRolesReply {
  repeated Role roles = 1;
}

message Role {
  string name = 1;
  string display_name = 2;
}

message LoginRequest {
  string code = 1;
  string state = 2;
}

message LoginReply {
  string token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
  User user = 4;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenReply {
  string token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
}

message User {
  int64 id = 1;
  string username = 2;
  string email = 3;
  string avatar = 4;
  string role = 5;
  string created_time = 6;
  string last_login_time = 7;
}

message ListUsersRequest {
  string keyword = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListUsersReply {
  repeated User users = 1;
  int64 total = 2;
}

message UpdateUserRoleRequest {
  int64 id = 1;
  string role = 2;
}

message UpdateUserRoleReply {
  bool success = 1;
  string message = 2;
}

message DeleteUserRequest {
  int64 id = 1;
}

message DeleteUserReply {
  bool success = 1;
  string message = 2;
}
